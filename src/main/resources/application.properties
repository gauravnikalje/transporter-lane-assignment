spring.application.name=transporter-lane-assignment
server.port=${PORT:8080}
# Render terminates HTTPS in front of the app; trust its forwarded headers so redirects and Swagger use https.
server.forward-headers-strategy=framework

# In-memory H2: data lives as long as the process. Re-submit the input after a restart.
spring.datasource.url=jdbc:h2:mem:transporters;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

# A quote like 5000.75 must be rejected, not silently cut to 5000.
spring.jackson.deserialization.accept-float-as-int=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Solver work budget = lane evaluations (about 50 million is well under a second of work).
transporter.solver.work-budget=50000000
transporter.solver.coverage-node-budget=2000000
transporter.limits.max-lanes=10000
transporter.limits.max-transporters=1000
transporter.limits.max-quotes=200000
# Lanes x transporters is the solver's table size (8 bytes per cell): 2 million cells is 16 MB.
transporter.limits.max-matrix-cells=2000000
