spring.application.name=transporter-lane-assignment
server.port=${PORT:8080}
# Render terminates HTTPS in front of the app; trust its forwarded headers so redirects and Swagger use https.
server.forward-headers-strategy=framework

# In-memory H2: data lives as long as the process. Re-submit the input after a restart.
spring.datasource.url=jdbc:h2:mem:transporters;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

# A quote like 5000.75 must be rejected, not silently cut to 5000, and "5000" (text) must not pass as a number.
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true

# Few request threads: each parsed request body is held in memory, so this bounds the memory a burst can take.
server.tomcat.threads.max=8
server.tomcat.threads.min-spare=2

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Solver budgets are counted in lane evaluations, so the time they allow does not depend on the input's shape.
# Sized for a small free host (about a fifth of a CPU): a few seconds at worst. Raise them on bigger hardware.
transporter.solver.work-budget=25000000
transporter.solver.seed-work-budget=10000000
transporter.solver.coverage-work-budget=20000000
# Size caps tuned for a 512 MB host with a fraction of a CPU. The brief's examples have 5 to 10 lanes.
transporter.limits.max-lanes=2000
transporter.limits.max-transporters=200
transporter.limits.max-quotes=10000
# Lanes x transporters is the solver's table size (8 bytes per cell).
transporter.limits.max-matrix-cells=200000
transporter.limits.max-body-bytes=1048576
